name: Check Prisma Migrations
on:
  workflow_call:

env:
  # This fork has no CI_DATABASE_URL secret; fall back to the postgres service below.
  DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/calendso' }}

jobs:
  check-prisma-migrations:
    name: Check migrations match schema
    runs-on: ubuntu-latest
    services:
      postgres:
        # No Docker Hub credentials: this fork doesn't have the secrets, and empty values make the workflow invalid.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendso
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - name: Check if migrations match schema
        working-directory: packages/prisma
        run: |
          npx prisma migrate diff --exit-code \
            --from-migrations ./migrations \
            --to-schema-datamodel ./schema.prisma \
            --shadow-database-url ${{ env.DATABASE_URL }}
