name: Build image

# Builds the production Docker image here instead of on Railway, whose ~40 min
# build deadline the uncached build kept hitting. Railway then deploys the
# prebuilt image from GHCR.

on:
  push:
    branches: [main]
    # `paths-ignore` can't re-include a file, so use `paths` with negations.
    # Later patterns win, which is how this workflow file is added back.
    paths:
      - "**"
      - "!.github/**"
      - "!docs/**"
      - "!**/*.md"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push contains everything an older queued build would ship.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: github.repository == 'garyvanhorn/cal.diy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # node_modules plus the image layers overflow the runner's default free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Only pass args that are set: an empty build arg overrides the Dockerfile
      # default (e.g. NEXT_PUBLIC_WEBAPP_URL) with "", which breaks the build.
      # These are all public values (they ship in the browser bundle); secrets
      # stay on Railway and are read at runtime, never baked into this image.
      - name: Collect build args
        id: args
        env:
          NEXT_PUBLIC_WEBAPP_URL: ${{ vars.NEXT_PUBLIC_WEBAPP_URL }}
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
          NEXT_PUBLIC_LICENSE_CONSENT: ${{ vars.NEXT_PUBLIC_LICENSE_CONSENT }}
          NEXT_PUBLIC_DISABLE_SIGNUP: ${{ vars.NEXT_PUBLIC_DISABLE_SIGNUP }}
          CALCOM_TELEMETRY_DISABLED: ${{ vars.CALCOM_TELEMETRY_DISABLED }}
          NEXT_PUBLIC_WEBSITE_TERMS_URL: ${{ vars.NEXT_PUBLIC_WEBSITE_TERMS_URL }}
          NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${{ vars.NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL }}
          NEXT_PUBLIC_API_V2_URL: ${{ vars.NEXT_PUBLIC_API_V2_URL }}
          NEXT_PUBLIC_SINGLE_ORG_SLUG: ${{ vars.NEXT_PUBLIC_SINGLE_ORG_SLUG }}
          ORGANIZATIONS_ENABLED: ${{ vars.ORGANIZATIONS_ENABLED }}
          CSP_POLICY: ${{ vars.CSP_POLICY }}
        run: |
          {
            echo "list<<EOF"
            # Prisma only needs a well-formed URL at build time; nothing connects to it.
            echo "DATABASE_URL=postgresql://build:build@localhost:5432/build"
            for name in NEXT_PUBLIC_WEBAPP_URL NEXT_PUBLIC_STRIPE_PUBLIC_KEY NEXT_PUBLIC_LICENSE_CONSENT \
              NEXT_PUBLIC_DISABLE_SIGNUP CALCOM_TELEMETRY_DISABLED NEXT_PUBLIC_WEBSITE_TERMS_URL \
              NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL NEXT_PUBLIC_API_V2_URL NEXT_PUBLIC_SINGLE_ORG_SLUG \
              ORGANIZATIONS_ENABLED CSP_POLICY; do
              value="${!name}"
              if [ -n "$value" ]; then
                echo "$name=$value"
                echo "Build arg $name is set" >&2
              else
                echo "Build arg $name not set, using Dockerfile default" >&2
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :main and :sha-<short>; a manual run on another branch gets
      # :<branch> and :sha-<short>, so test builds never move :main.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Off until Railway's `web` service deploys from this image (repo variable
      # RAILWAY_DEPLOY_FROM_GHCR=true). Before that, --from-source would start
      # another GitHub build on Railway.
      - name: Deploy on Railway
        if: github.ref == 'refs/heads/main' && vars.RAILWAY_DEPLOY_FROM_GHCR == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npx --yes @railway/cli@5.71.0 redeploy --service web --from-source --yes
